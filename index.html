<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zupi Indica Metrics</title>
<style>
  :root { --bg:#120820; --fg:#f4f0fa; --muted:#b9aed0; --accent:#3fd9c8; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf8fc; --fg:#201434; --muted:#6a5c86; --accent:#1f9c8d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  .links { display:flex; flex-direction:column; gap: 14px; margin-top: 32px; }
  a.card { display:block; padding: 18px 20px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); text-decoration:none; color:var(--fg); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  a.card b { display:block; font-size: 1.05rem; }
  a.card span { color: var(--muted); font-size: .9rem; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Zupi Indica Metrics</h1>
  <p class="sub">Documentos legais da integração de leitura de métricas da conta Zupi Indica.</p>
  <div class="links">
    <a class="card" href="terms.html"><b>Termos de Serviço</b><span>Regras de uso desta integração interna.</span></a>
    <a class="card" href="privacy.html"><b>Política de Privacidade</b><span>Quais dados são acessados, como são usados e guardados.</span></a>
  </div>
  <footer>Zupi Indica &middot; contato: prodbysantt@gmail.com</footer>
</main>
</body>
</html>
