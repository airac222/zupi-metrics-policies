<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorização recebida — Zupi Indica Metrics</title>
<style>
  :root { --bg:#120820; --fg:#f4f0fa; --muted:#b9aed0; --accent:#3fd9c8; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf8fc; --fg:#201434; --muted:#6a5c86; --accent:#1f9c8d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font-size: 1.3rem; }
  p { color: var(--muted); }
  .box { background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 10px; padding: 16px; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: .95rem; color: var(--fg); margin: 16px 0; }
  button { background: var(--accent); color: #0b1016; border: none; border-radius: 8px; padding: 10px 16px; font-size: .95rem; cursor: pointer; }
  .warn { color: #ffb4b4; }
</style>
</head>
<body>
<main>
  <h1>Autorização do TikTok recebida</h1>
  <p>Copie o código abaixo e use-o para concluir a troca de token localmente (não envie este código a ninguém).</p>
  <div class="box" id="code">(lendo...)</div>
  <button id="copyBtn">Copiar código</button>
  <p id="state" style="margin-top:28px"></p>
  <p class="warn" id="err" hidden>Nenhum código encontrado na URL. Verifique se a autorização foi concluída.</p>
</main>
<script>
  try {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var codeEl = document.getElementById('code');
    var errEl = document.getElementById('err');
    var stateEl = document.getElementById('state');
    if (code) {
      codeEl.textContent = code;
      if (state) stateEl.textContent = 'state: ' + state;
      document.getElementById('copyBtn').addEventListener('click', function () {
        navigator.clipboard.writeText(code).catch(function () {});
      });
    } else {
      codeEl.textContent = '—';
      errEl.hidden = false;
    }
  } catch (e) {}
</script>
</body>
</html>
